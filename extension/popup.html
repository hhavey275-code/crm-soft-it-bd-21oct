<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>DSL & Cards Sync</title>
    <style>
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --border: #334155;
        --fg: #f1f5f9;
        --muted: #94a3b8;
        --primary: #3b82f6;
        --primary-hover: #2563eb;
        --success: #10b981;
        --error: #ef4444;
      }
      * { box-sizing: border-box; }
      body {
        width: 360px;
        margin: 0;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        font-size: 13px;
        background: var(--bg);
        color: var(--fg);
      }
      h1 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
      .subtitle { color: var(--muted); font-size: 11px; margin-bottom: 12px; }
      label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; }
      input {
        width: 100%;
        padding: 8px 10px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--fg);
        font-size: 12px;
        margin-bottom: 8px;
      }
      input:focus { outline: none; border-color: var(--primary); }
      button {
        width: 100%;
        padding: 9px 12px;
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        margin-bottom: 6px;
      }
      button:hover:not(:disabled) { background: var(--primary-hover); }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      button.secondary { background: transparent; border: 1px solid var(--border); color: var(--fg); }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 10px;
      }
      .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      .muted { color: var(--muted); font-size: 11px; }
      .status {
        padding: 8px 10px;
        border-radius: 6px;
        font-size: 12px;
        margin-bottom: 10px;
        display: none;
      }
      .status.show { display: block; }
      .status.success { background: rgba(16, 185, 129, 0.15); color: var(--success); }
      .status.error { background: rgba(239, 68, 68, 0.15); color: var(--error); }
      .status.info { background: rgba(59, 130, 246, 0.15); color: var(--primary); }
      .progress {
        height: 4px;
        background: var(--border);
        border-radius: 2px;
        overflow: hidden;
        margin: 8px 0;
      }
      .progress-bar { height: 100%; background: var(--primary); width: 0; transition: width 0.2s; }
      .hidden { display: none !important; }
      .results {
        max-height: 200px;
        overflow-y: auto;
        font-size: 11px;
        margin-top: 8px;
      }
      .results .row { padding: 4px 0; border-bottom: 1px solid var(--border); }
      .results .row:last-child { border-bottom: none; }
      a { color: var(--primary); text-decoration: none; font-size: 11px; }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <h1>DSL & Cards Sync</h1>
    <div class="subtitle">Daily Spending Limit and card sync for ad accounts</div>

    <div id="status" class="status"></div>

    <!-- Setup view -->
    <div id="setup-view">
      <div class="card">
        <label for="api-url">App URL</label>
        <input id="api-url" type="text" placeholder="https://your-app.lovable.app" />

        <label for="email">Admin Email</label>
        <input id="email" type="email" placeholder="admin@example.com" />

        <label for="password">Password</label>
        <input id="password" type="password" placeholder="••••••••" />

        <label for="anon-key">Supabase Anon Key</label>
        <input id="anon-key" type="password" placeholder="eyJhbG..." />

        <button id="login-btn">Save & Login</button>
      </div>
      <div class="muted">
        These credentials are stored locally in Chrome storage only.
      </div>
    </div>

    <!-- Main view -->
    <div id="main-view" class="hidden">
      <div class="card">
        <div class="row">
          <div>
            <div style="font-weight:500;">Logged in</div>
            <div class="muted" id="user-email"></div>
          </div>
          <button class="secondary" id="logout-btn" style="width:auto;padding:4px 10px;font-size:11px;margin:0;">Logout</button>
        </div>
      </div>

      <button id="sync-btn">Sync DSL & Cards from Facebook</button>
      <div class="muted" style="margin-bottom:8px;">
        Make sure you're logged into Facebook with full BM admin access.
      </div>

      <div class="card" style="padding:10px 12px;">
        <div class="row" style="align-items:flex-start;">
          <div style="min-width:0;">
            <div style="font-weight:500;font-size:12px;">Auto-sync (hourly)</div>
            <div class="muted" id="auto-sync-status" style="margin-top:2px;">Loading...</div>
          </div>
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:11px;color:var(--muted);margin:0;">
            <input id="auto-sync-toggle" type="checkbox" style="width:auto;margin:0;" />
            <span id="auto-sync-label">On</span>
          </label>
        </div>
      </div>

      <div id="progress-wrap" class="hidden">
        <div class="progress"><div id="progress-bar" class="progress-bar"></div></div>
        <div class="muted" id="progress-text">Working...</div>
      </div>

      <div id="results" class="results"></div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
